<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Explora AP - TCC (RA com Superfície)</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  
  <style>
    /* DESIGN DA TELA DE ENTRADA */
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; }
    
    #webcam {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1; display: none;
    }

    .tela-entrada {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #004d40, #00251a); z-index: 999;
      transition: opacity 0.5s;
    }
    
    .escondido { display: none !important; }

    /* MENSAGEM DE INSTRUÇÃO RA */
    #aviso-ra {
      position: absolute; bottom: 10%; left: 0; width: 100%;
      text-align: center; pointer-events: none; z-index: 9999;
      display: none;
    }
    .aviso-texto {
      background: rgba(0,0,0,0.7); color: #FFD700; padding: 10px 20px;
      border-radius: 30px; font-size: 1.2rem; font-weight: bold;
    }

    h1 { color: white; font-size: 2.5rem; margin-bottom: 5px; text-align: center; text-transform: uppercase; }
    p { color: #b2dfdb; margin-bottom: 30px; font-style: italic; }

    .btn-menu {
      width: 280px; padding: 20px; margin: 10px; border: none; border-radius: 50px;
      font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    .btn-ra { background: #fff; color: #004d40; }
    .btn-vr { background: #222; color: #FFD700; border: 2px solid #FFD700; }
  </style>

  <script>
    /* --- LÓGICA DO SISTEMA --- */
    let cidadeAtual = '';
    let audioNarracao = null;
    let mapaPosicionado = false;

    // BANCO DE DADOS
    const db = {
      'vitoria': {
        nome: 'Vitoria do Jari',
        conteudos: {
          'historia': { t: 'VIDEO DA CIDADE', txt: 'Assista ao video no painel.', video: './assets/videos/vitoria.mp4', tipo: 'video', imagemPainel: '', narra: '' },
          'culinaria': { t: 'HINO OFICIAL', txt: 'Ouca o audio.', video: '', tipo: 'audio', imagemPainel: '', narra: './assets/audios/vitoria.mp3' },
          'mapa': { t: 'BANDEIRA', txt: 'Visualizando bandeira.', video: '', tipo: 'imagem', imagemPainel: './assets/imagens/vitoria.png', narra: '' }
        }
      },
      'macapa': { nome: 'Macapa', conteudos: {} }, 'amapa': { nome: 'Amapa', conteudos: {} },
      'oiapoque': { nome: 'Oiapoque', conteudos: {} }, 'mazagao': { nome: 'Mazagao', conteudos: {} },
      'santana': { nome: 'Santana', conteudos: {} }, 'laranjal': { nome: 'Laranjal', conteudos: {} },
      'calcoene': { nome: 'Calcoene', conteudos: {} }, 'cutias': { nome: 'Cutias', conteudos: {} },
      'ferreira': { nome: 'Ferreira Gomes', conteudos: {} }, 'itaubal': { nome: 'Itaubal', conteudos: {} },
      'pedra': { nome: 'Pedra Branca', conteudos: {} }, 'porto': { nome: 'Porto Grande', conteudos: {} },
      'pracuuba': { nome: 'Pracuuba', conteudos: {} }, 'serra': { nome: 'Serra do Navio', conteudos: {} },
      'tartarugal': { nome: 'Tartarugalzinho', conteudos: {} }
    };

    // --- COMPONENTE DE RA (HIT-TEST) ---
    // Este componente controla o "anel" que detecta o chão
    AFRAME.registerComponent('ar-controlador', {
      init: function () {
        this.reticulo = document.getElementById('ar-reticulo');
        this.mapaContainer = document.getElementById('menu-mapa-ra');
        this.aviso = document.getElementById('txt-aviso');
        
        // Quando tocar na tela (select)
        this.el.sceneEl.addEventListener('click', () => {
          if (this.reticulo.getAttribute('visible') === true && !mapaPosicionado) {
            // Posiciona o mapa onde o retículo está
            this.mapaContainer.setAttribute('position', this.reticulo.getAttribute('position'));
            this.mapaContainer.setAttribute('rotation', this.reticulo.getAttribute('rotation'));
            this.mapaContainer.setAttribute('visible', 'true');
            
            // Trava o mapa e esconde o retículo
            mapaPosicionado = true;
            this.reticulo.setAttribute('visible', 'false');
            this.aviso.innerText = "Toque nas cidades para explorar";
            
            // Remove o listener de hit-test para economizar bateria
            this.el.removeAttribute('ar-hit-test'); 
          }
        });
      }
    });

    // --- FUNÇÕES DE NAVEGAÇÃO ---

    function iniciarRA() {
      // Entra no modo WebXR AR
      const cena = document.querySelector('a-scene');
      
      document.querySelector('.tela-entrada').classList.add('escondido');
      document.getElementById('aviso-ra').style.display = 'block';
      
      // Ativa o Hit Test na cena
      cena.setAttribute('webxr', 'optionalFeatures: hit-test, dom-overlay; overlayElement: #aviso-ra');
      cena.enterVR(); 

      // Configura visibilidade
      document.getElementById('ceu').setAttribute('visible', 'false');
      document.getElementById('menu-grade-vr').setAttribute('visible', 'false');
      
      // O mapa começa invisível até o usuário clicar no chão
      document.getElementById('menu-mapa-ra').setAttribute('visible', 'false');
      mapaPosicionado = false;
    }

    function iniciarVR() {
      // Modo VR clássico
      document.querySelector('.tela-entrada').classList.add('escondido');
      document.getElementById('ceu').setAttribute('visible', 'true');
      document.getElementById('menu-grade-vr').setAttribute('visible', 'true');
      document.getElementById('menu-mapa-ra').setAttribute('visible', 'false');
      
      // Desativa o retículo de RA se estiver visível
      document.getElementById('ar-reticulo').setAttribute('visible', 'false');
    }

    function selecionarCidade(chave) {
      if(!db[chave]) return;
      cidadeAtual = chave;
      let nome = db[chave].nome || chave;
      document.getElementById('titulo-cat').setAttribute('value', nome.toUpperCase());

      // Se estiver em RA, esconde o mapa e mostra o painel flutuando no mesmo lugar
      if (document.querySelector('a-scene').is('ar-mode')) {
         document.getElementById('menu-mapa-ra').setAttribute('visible', 'false');
         
         // Move o menu de categorias para onde o mapa estava
         const posMapa = document.getElementById('menu-mapa-ra').getAttribute('position');
         const rotMapa = document.getElementById('menu-mapa-ra').getAttribute('rotation');
         
         const menuCat = document.getElementById('menu-categorias');
         menuCat.setAttribute('position', `${posMapa.x} ${posMapa.y + 0.5} ${posMapa.z}`);
         menuCat.setAttribute('rotation', rotMapa); // Mantém rotação alinhada
         // Força "olhar" para o usuário se necessário, mas usar a rotação do chão é melhor pra estabilidade
      } else {
         // Lógica VR normal
         document.getElementById('menu-grade-vr').setAttribute('visible', 'false');
      }
      
      document.getElementById('menu-categorias').setAttribute('visible', 'true');
    }

    function verConteudo(tipo) {
      const dados = (db[cidadeAtual] && db[cidadeAtual].conteudos && db[cidadeAtual].conteudos[tipo]) 
                    ? db[cidadeAtual].conteudos[tipo] 
                    : { t: 'EM BREVE', txt: 'Conteudo em desenvolvimento.', tipo: 'texto' };

      document.getElementById('menu-categorias').setAttribute('visible', 'false');
      
      // Posiciona o painel final no mesmo lugar do menu anterior
      const menuCat = document.getElementById('menu-categorias');
      const painel = document.getElementById('painel-conteudo');
      painel.setAttribute('position', menuCat.getAttribute('position'));
      painel.setAttribute('rotation', menuCat.getAttribute('rotation'));
      painel.setAttribute('visible', 'true');

      // Preenche dados
      document.getElementById('vr-titulo').setAttribute('value', dados.t);
      document.getElementById('vr-texto').setAttribute('value', dados.txt);
      
      resetarMidia();

      const videoEl = document.getElementById('video-player');
      const telaVideo = document.getElementById('vr-video');
      const imgPainel = document.getElementById('vr-imagem');
      const controles = document.getElementById('controles-media');

      if (dados.tipo === 'video' && dados.video) {
        videoEl.setAttribute('src', dados.video);
        telaVideo.setAttribute('visible', 'true');
        controles.setAttribute('visible', 'true');
        document.getElementById('vr-texto').setAttribute('visible', 'false');
        atualizarBtnPlay('PLAY', '#008000');
      } 
      else if (dados.tipo === 'audio' && dados.narra) {
        audioNarracao = new Audio(dados.narra);
        controles.setAttribute('visible', 'true');
        document.getElementById('vr-texto').setAttribute('visible', 'true');
        atualizarBtnPlay('PLAY', '#008000');
      }
      else if (dados.tipo === 'imagem' && dados.imagemPainel) {
        imgPainel.setAttribute('src', dados.imagemPainel);
        imgPainel.setAttribute('visible', 'true');
        document.getElementById('vr-texto').setAttribute('visible', 'false');
      }
    }

    // --- CONTROLES MÍDIA ---
    function togglePlay() {
      const videoEl = document.getElementById('video-player');
      if (videoEl && videoEl.getAttribute('src')) {
        videoEl.paused ? (videoEl.play(), atualizarBtnPlay('PAUSE', '#FF0000')) : (videoEl.pause(), atualizarBtnPlay('PLAY', '#008000'));
      }
      if (audioNarracao) {
        audioNarracao.paused ? (audioNarracao.play(), atualizarBtnPlay('PAUSE', '#FF0000')) : (audioNarracao.pause(), atualizarBtnPlay('PLAY', '#008000'));
      }
    }

    function reiniciar() {
      const videoEl = document.getElementById('video-player');
      if (videoEl && videoEl.getAttribute('src')) { videoEl.currentTime = 0; videoEl.play(); }
      if (audioNarracao) { audioNarracao.currentTime = 0; audioNarracao.play(); }
      atualizarBtnPlay('PAUSE', '#FF0000');
    }

    function atualizarBtnPlay(texto, cor) {
      document.getElementById('btn-play-bg').setAttribute('color', cor);
      document.getElementById('btn-play-txt').setAttribute('value', texto);
    }

    function resetarMidia() {
      const v = document.getElementById('video-player');
      v.pause(); v.removeAttribute('src');
      if(audioNarracao) { audioNarracao.pause(); audioNarracao = null; }
      document.getElementById('vr-video').setAttribute('visible', 'false');
      document.getElementById('vr-imagem').setAttribute('visible', 'false');
      document.getElementById('controles-media').setAttribute('visible', 'false');
    }

    function voltarMenu(origem) {
      resetarMidia();
      if(origem === 'conteudo') {
        document.getElementById('painel-conteudo').setAttribute('visible', 'false');
        document.getElementById('menu-categorias').setAttribute('visible', 'true');
      } else {
        document.getElementById('menu-categorias').setAttribute('visible', 'false');
        
        // Se estiver em AR, volta para o mapa AR
        if (document.querySelector('a-scene').is('ar-mode')) {
           document.getElementById('menu-mapa-ra').setAttribute('visible', 'true');
        } else {
           document.getElementById('menu-grade-vr').setAttribute('visible', 'true');
        }
      }
    }
  </script>
</head>
<body>

  <div id="aviso-ra">
    <span id="txt-aviso" class="aviso-texto">Mova o celular para detectar o chão...</span>
  </div>

  <div class="tela-entrada">
    <h1>Explora AP</h1>
    <p>Escolha o modo de exploração:</p>
    <button class="btn-menu btn-ra" onclick="iniciarRA()">📷 Iniciar RA<br><span style="font-size:0.8rem">(Detectar Chão)</span></button>
    <button class="btn-menu btn-vr" onclick="iniciarVR()">🥽 Iniciar VR<br><span style="font-size:0.8rem">(Mundo Virtual)</span></button>
  </div>

  <a-scene ar-hit-test="target: #ar-reticulo; type: map" ar-controlador cursor="rayOrigin: mouse" raycaster="objects: .interativo">
    
    <a-sky id="ceu" color="#202020"></a-sky>

    <a-assets>
      <video id="video-player" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
      <img id="img-mapa" src="./assets/imagens/mapa_amapa.png">
      
      <a-mixin id="btn-padrao" geometry="primitive: plane; width: 2.2; height: 0.5" 
               material="color: #333; opacity: 0.9" text="align: center; color: white; width: 4"></a-mixin>
      <a-mixin id="btn-cidade" geometry="primitive: plane; width: 1.4; height: 0.4"
               material="color: #FFD700" text="align: center; color: black; width: 3.5"
               animation__hover="property: scale; to: 1.1 1.1 1; startEvents: mouseenter; dur: 200"
               animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"></a-mixin>
    </a-assets>

    <a-entity id="ar-reticulo" geometry="primitive: ring; radiusInner: 0.2; radiusOuter: 0.3" 
              material="color: #FFD700; shader: flat" rotation="-90 0 0" visible="false"></a-entity>

    <a-entity id="menu-mapa-ra" visible="false">
      
      <a-image src="#img-mapa" width="4" height="4" position="0 0 0" rotation="-90 0 0" opacity="0.9"></a-image>

      <a-entity position="0 0 -1.5" rotation="-90 0 0" geometry="primitive: circle; radius: 0.3" material="color: yellow; opacity: 0.3" class="interativo" onclick="selecionarCidade('oiapoque')"></a-entity>
      
      <a-entity position="0.8 0 0.5" rotation="-90 0 0" geometry="primitive: circle; radius: 0.3" material="color: yellow; opacity: 0.3" class="interativo" onclick="selecionarCidade('macapa')"></a-entity>
      
      <a-entity position="-0.5 0 1.5" rotation="-90 0 0" geometry="primitive: circle; radius: 0.3" material="color: yellow; opacity: 0.3" class="interativo" onclick="selecionarCidade('vitoria')"></a-entity>

      </a-entity>

    <a-entity id="menu-grade-vr" visible="false" position="0 1.6 -3">
      <a-text value="SELECIONE O DESTINO" align="center" position="0 2.2 0" width="6"></a-text>
      
      <a-entity mixin="btn-cidade" position="-1.6 1.2 0" text="value: Vitoria do Jari" class="interativo" onclick="selecionarCidade('vitoria')"></a-entity>
      <a-entity mixin="btn-cidade" position="-0.55 1.2 0" text="value: Macapa" class="interativo" onclick="selecionarCidade('macapa')"></a-entity>
      <a-entity mixin="btn-cidade" position="0.55 1.2 0" text="value: Santana" class="interativo" onclick="selecionarCidade('santana')"></a-entity>
      <a-entity mixin="btn-cidade" position="1.6 1.2 0" text="value: Mazagao" class="interativo" onclick="selecionarCidade('mazagao')"></a-entity>
      </a-entity>

    <a-entity id="menu-categorias" visible="false" position="0 1.6 -3">
      <a-text id="titulo-cat" value="CIDADE" align="center" position="0 1.5 0" color="#FFD700" width="7"></a-text>
      
      <a-entity mixin="btn-padrao" position="0 0.8 0" text="value: VIDEO" class="interativo" onclick="verConteudo('historia')"></a-entity>
      <a-entity mixin="btn-padrao" position="0 0.2 0" text="value: HINO" class="interativo" onclick="verConteudo('culinaria')"></a-entity>
      <a-entity mixin="btn-padrao" position="0 -0.4 0" text="value: BANDEIRA" class="interativo" onclick="verConteudo('mapa')"></a-entity>

      <a-entity geometry="primitive: plane; width: 1.5; height: 0.4" material="color: #777" 
                text="value: << VOLTAR; align: center; width: 4" position="0 -1.2 0"
                class="interativo" onclick="voltarMenu('cidades')"></a-entity>
    </a-entity>

    <a-entity id="painel-conteudo" visible="false" position="0 1.6 -3">
      <a-plane color="#000" width="4" height="3" opacity="0.95"></a-plane>

      <a-text id="vr-titulo" value="TITULO" align="center" position="0 1.2 0.1" color="#FFD700" width="6"></a-text>
      <a-text id="vr-texto" value="Texto..." align="center" position="0 0 0.1" width="3.5" wrap-count="35"></a-text>

      <a-video id="vr-video" src="#video-player" width="3.2" height="1.8" position="0 0.1 0.05" visible="false"></a-video>
      <a-image id="vr-imagem" width="2.5" height="1.6" position="0 0.1 0.05" visible="false"></a-image>

      <a-entity id="controles-media" position="0 -1.1 0.2" visible="false">
        <a-entity position="-0.7 0 0" class="interativo" onclick="togglePlay()">
           <a-circle id="btn-play-bg" radius="0.35" color="#008000"></a-circle>
           <a-text id="btn-play-txt" value="PLAY" align="center" position="0 0 0.05" width="4"></a-text>
        </a-entity>
        <a-entity position="0.7 0 0" class="interativo" onclick="reiniciar()">
           <a-circle radius="0.35" color="#0055ff"></a-circle>
           <a-text value="RESTART" align="center" position="0 0 0.05" width="2.5"></a-text>
        </a-entity>
      </a-entity>

      <a-entity geometry="primitive: plane; width: 1.5; height: 0.4" material="color: #555" 
                text="value: << VOLTAR; align: center; width: 4" position="0 -1.8 0"
                class="interativo" onclick="voltarMenu('conteudo')"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
