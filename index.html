<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Amapá Interativo</title>
  
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  <script src="https://unpkg.com/aframe-troika-text@0.10.0/dist/aframe-troika-text.min.js"></script>
  
  <script>
    /* --- CONFIGURAÇÃO E DADOS --- */
    const db = {
      'vitoria': {
        nome: 'Vitória do Jari',
        fundo360: './assets/imagens/1vtj360.jpg',
        bandeira: './assets/imagens/vitoria.png',
        hino: './assets/audios/vitoria.mp3', 
        imgHino: './assets/imagens/hino.png',
        conteudos: {
          'Historia': { t: 'História', video: './assets/videos/vit360.mp4', tipo: 'video360' },
          'Quiz': { 
              type: 'quiz', 
              fundo360: './assets/3d/rot.jpg', 
              perguntas: [
                  { p: 'Em que data foi criado o município de Vitória do Jari?', opcoes: ['08 de setembro de 1990', '08 de setembro de 1994', '05 de outubro de 1988'], correta: 1 },
                {  p: 'Qual é o principal rio que banha o município?', opcoes: [ 'Rio Jari', 'Rio Amazonas', 'Rio Araguari'], correta: 0 },
                  { p: 'Qual o gentílico de quem nasce em Vitória do Jari?', opcoes: ['Jariense', 'Macapaense', 'Vitorense'], correta: 2 }
              ]
          },
          'Informacoes': { 
              t: 'Informações Gerais', type: 'galeriaImagem', 
              fundo360: './assets/imagens/3vtj360.jpg',
              itens: [
                  { img: './assets/imagens/vtjorigem.jpg'},
                  { img: './assets/imagens/geogra.png'},
                  { img: './assets/imagens/festividade.png'}
              ]
          }
        }
      },
      'macapa': { 
          nome: 'Macapá', 
          bandeira: './assets/imagens/macapa.png', 
          hino: './assets/audios/macapa.mp3', 
          conteudos: {
            'Historia': { t: 'História', video: './assets/videos/mac360.mp4', tipo: 'video360' },
            'Quiz': { 
                type: 'quiz', 
                perguntas: [
                    { p: 'Qual monumento marca a linha do Equador?', opcoes: ['Fortaleza', 'Marco Zero', 'Trapiche'], correta: 1 }
                ]
            },
            'Informacoes': { 
                t: 'Informações Gerais', type: 'galeriaImagem', itens: [
                    { img: '', txt: 'Balneário' },
                    { img: '', txt: 'Fortaleza São José' },
                    { img: '', txt: 'Marco Zero' }
                ]
            }
          }
      },
      'laranjal do jari': { nome: 'Laranjal do Jari', bandeira: './assets/imagens/laranjal.png', hino: './assets/audios/laranjal.mp3', 
          conteudos: {
            'Historia': { t: 'História', video: './assets/videos/lj360.mp4', tipo: 'video360' },
            'Quiz': { type: 'quiz', perguntas: [{ p: 'Qual a principal cachoeira?', opcoes: ['Santo Antônio', 'Paredão'], correta: 0 }] },
            'Informacoes': { 
                t: 'Informações Gerais', type: 'galeriaImagem', itens: [
                    { img: '', txt: 'Cachoeira de Santo Antônio' },
                    { img: '', txt: 'Praça João da Silva Nery' },
                    { img: '', txt: 'Baln. Sombra da Mata' }
                ]
            }
          } 
      },
      'oiapoque': { nome: 'Oiapoque', bandeira: './assets/imagens/oiapoque.png', hino: './assets/audios/oiapoque.mp3',  
          conteudos: {
            'Historia': { t: 'História', video: './assets/videos/oia360.mp4', tipo: 'video360' },
            'Quiz': { type: 'quiz', perguntas: [{ p: 'Faz fronteira com qual país?', opcoes: ['Suriname', 'Guiana Francesa'], correta: 1 }] },
            'Informacoes': { 
                t: 'Informações Gerais', type: 'galeriaImagem', itens: [
                    { img: '', txt: 'Obelisco' },
                    { img: '', txt: 'Igreja' },
                    { img: '', txt: 'Chácara' }
                ]
            }
          } 
      },
      'santana': { nome: 'Santana', bandeira: './assets/imagens/santana.jpg', hino: './assets/audios/santana.mp3',  
          conteudos: {
            'Historia': { t: 'História', video: './assets/videos/sant360.mp4', tipo: 'video360' },
            'Quiz': { type: 'quiz', perguntas: [{ p: 'Qual o principal porto?', opcoes: ['Santana', 'Macapá'], correta: 0 }] },
            'Informacoes': { 
                t: 'Informações Gerais', type: 'galeriaImagem', itens: [
                    { img: '', txt: 'Amazon Beach' },
                    { img: '', txt: 'Porto de Santana' },
                    { img: '', txt: 'Paróquia' }
                ]
            }
          } 
      }
    };

    let cidadeAtual = '';
    let categoriaAtual = '';

    window.onload = function() {
      gerarMenuCidades();
      setupVideoEvents();
    };

    function gerarMenuCidades() {
      const container = document.getElementById('grade-cidades');
      const chaves = Object.keys(db);
      const posicoes = [
          { pos: '-2.8 1.8 -2.0', rot: '0 45 0' }, { pos: '-1.4 1.8 -3.0', rot: '0 25 0' },  
          { pos: '0 1.8 -3.5', rot: '0 0 0' }, { pos: '1.4 1.8 -3.0', rot: '0 -25 0' }, { pos: '2.8 1.8 -2.0', rot: '0 -45 0' }  
      ];
      chaves.forEach((chave, index) => {
        if(index >= posicoes.length) return;
        const cidade = db[chave];
        const p = posicoes[index];
        const el = document.createElement('a-entity');
        el.setAttribute('position', p.pos);
        el.setAttribute('rotation', p.rot);
        el.innerHTML = `
          <a-plane src="${cidade.bandeira}" width="1" height="0.7" class="clicavel interativo" onclick="selecionarCidade('${chave}')" material="shader: flat; side: double">
             <a-plane position="0 0 -0.01" width="1.05" height="0.75" color="#FFD700" material="shader: flat"></a-plane>
          </a-plane>
          <a-troika-text value="${cidade.nome}" align="center" position="0 -0.6 0.05" width="4" color="#FFFFFF" outline-width="0.02" outline-color="#000"></a-troika-text>
        `;
        container.appendChild(el);
      });
    }

    /* --- LÓGICA DO HINO --- */
    function alternarHino() {
        const hinoEl = document.getElementById('audio-hino');
        const btnText = document.getElementById('btn-text-hino');
        if (hinoEl.paused) { hinoEl.play(); btnText.setAttribute('value', 'Pausar'); }
        else { hinoEl.pause(); btnText.setAttribute('value', 'Tocar'); }
    }

    /* --- NAVEGAÇÃO --- */
    function irPara(idGrupo) {
      const grupos = ['grupo-inicio', 'grupo-cidades', 'grupo-categorias', 'grupo-player', 'grupo-informacoes-galeria', 'grupo-quiz', 'grupo-hino'];
      grupos.forEach(g => {
        const el = document.getElementById(g);
        if(el) { el.setAttribute('visible', 'false'); el.querySelectorAll('.interativo').forEach(b => b.classList.remove('clicavel')); }
      });
      desativarModo360();
      if (idGrupo !== 'grupo-hino') {
          document.getElementById('audio-hino').pause();
          const bText = document.getElementById('btn-text-hino');
          if(bText) bText.setAttribute('value', 'Tocar');
      }
      const destino = document.getElementById(idGrupo);
      if(destino) {
          destino.setAttribute('visible', 'true');
          destino.querySelectorAll('.interativo').forEach(b => b.classList.add('clicavel'));
          atualizarAmbiente(idGrupo);
      }
      if(idGrupo !== 'grupo-categorias') pararMidiasConteudo();
    }

    function selecionarCidade(chave) {
      cidadeAtual = chave;
      document.getElementById('titulo-cidade-cat').setAttribute('value', db[chave].nome);
      irPara('grupo-categorias');
    }

    function verConteudo(tipo) {
      if (tipo === 'Hino') {
          const cidade = db[cidadeAtual];
          document.getElementById('audio-hino').src = cidade.hino;
          
          const imagemDoHino = cidade.imgHino ? cidade.imgHino : '';
          document.getElementById('img-hino-display').setAttribute('src', imagemDoHino);
          
          irPara('grupo-hino');
          return;
      }
      if(!db[cidadeAtual].conteudos[tipo]) return;
      const dados = db[cidadeAtual].conteudos[tipo];
      categoriaAtual = tipo;
      pararMidiasConteudo();
      if (dados.tipo === 'video360') { ativarModo360(dados.video); return; }
      if (dados.type === 'galeriaImagem') { montarGaleriaImagens(dados.itens); irPara('grupo-informacoes-galeria'); return; }
      if (dados.type === 'quiz') { iniciarQuiz(dados.perguntas); return; }
      irPara('grupo-player');
    }

    function montarGaleriaImagens(itens) {
        const container = document.getElementById('container-molduras-info');
        container.innerHTML = ''; 
        
        const pos = [ 
            {p: '-2.2 1.6 -2.5', r: '0 25 0'}, 
            {p: '0 1.6 -3', r: '0 0 0'}, 
            {p: '2.2 1.6 -2.5', r: '0 -25 0'} 
        ];

        itens.forEach((item, index) => {
            if(index >= 3) return; 
            
            const el = document.createElement('a-entity');
            el.setAttribute('position', pos[index].p); 
            el.setAttribute('rotation', pos[index].r);
            
            const srcAttr = item.img ? `src="${item.img}"` : 'color="#555"';
            
            el.innerHTML = `
                <a-plane ${srcAttr} width="1.5" height="2" class="img-moldura" material="shader: flat; side: double"></a-plane>`;
            container.appendChild(el);
        });
    }

    /* --- LÓGICA DO QUIZ --- */
    let perguntasQuiz = [];
    let indicePerguntaAtual = 0;

    function iniciarQuiz(perguntas) {
        perguntasQuiz = perguntas; indicePerguntaAtual = 0;
        document.getElementById('quiz-feedback').setAttribute('value', '');
        document.getElementById('quiz-titulo').setAttribute('value', 'Quiz: ' + db[cidadeAtual].nome);
        mostrarPergunta();
        irPara('grupo-quiz');
    }

    function mostrarPergunta() {
        const perguntaText = document.getElementById('quiz-pergunta');
        const containerOpcoes = document.getElementById('quiz-opcoes');
        const feedbackText = document.getElementById('quiz-feedback');
        feedbackText.setAttribute('value', ''); 
        
        if (indicePerguntaAtual >= perguntasQuiz.length) {
            perguntaText.setAttribute('value', 'Parabéns! Concluiu o Quiz.');
            perguntaText.setAttribute('color', '#00FF00');
            containerOpcoes.innerHTML = ''; return;
        }
        
        const perguntaAtual = perguntasQuiz[indicePerguntaAtual];
        perguntaText.setAttribute('value', perguntaAtual.p);
        perguntaText.setAttribute('color', '#FFD700'); // Reseta a cor para amarelo a cada pergunta
        containerOpcoes.innerHTML = '';
        
        const posicoesY = [0.8, 0.2, -0.4]; 
        perguntaAtual.opcoes.forEach((opcao, index) => {
            const el = document.createElement('a-entity');
            el.setAttribute('position', `0 ${posicoesY[index]} 0`);
            
            // Alteração: Passei a palavra "this" dentro do verificarResposta para o código saber qual botão foi clicado
            el.innerHTML = `
                <a-plane width="3.5" height="0.45" color="#E64A19" class="clicavel interativo" onclick="verificarResposta(${index}, ${perguntaAtual.correta}, this)" material="shader: flat">
                    <a-troika-text value="${opcao}" align="center" position="0 0 0.02" width="3" color="#FFF"></a-troika-text>
                </a-plane>`;
            containerOpcoes.appendChild(el);
        });
    }

    // Alteração: Agora a função recebe o botão ("btn") para podermos pintar ele
    function verificarResposta(indiceEscolhido, indiceCorreto, btn) {
        const feedback = document.getElementById('quiz-feedback');
        const container = document.getElementById('quiz-opcoes');
        
        // Remove a interatividade para evitar cliques duplos rápidos
        container.querySelectorAll('.interativo').forEach(b => b.classList.remove('clicavel'));
        
        // Alterado de === para == para garantir que textos e números se comparem corretamente
        if (indiceEscolhido == indiceCorreto) {
            btn.setAttribute('color', '#388E3C'); // Pinta o botão de VERDE ESCURO
            feedback.setAttribute('value', 'Acertou!'); 
            feedback.setAttribute('color', '#00FF00'); 
            
            setTimeout(() => { 
                indicePerguntaAtual++; 
                mostrarPergunta(); 
            }, 2000);
        } else {
            btn.setAttribute('color', '#D32F2F'); // Pinta o botão de VERMELHO
            feedback.setAttribute('value', 'Errou. Tente novamente!'); 
            feedback.setAttribute('color', '#FF0000'); 
            
            setTimeout(() => { 
                feedback.setAttribute('value', ''); 
                btn.setAttribute('color', '#E64A19'); // Volta a cor Laranja original
                container.querySelectorAll('.interativo').forEach(b => b.classList.add('clicavel')); 
            }, 2000);
        }
    }

    /* --- VÍDEO 360 --- */
    function ativarModo360(videoSrc) {
        const sky360 = document.getElementById('fundo-360-estatico');
        sky360.setAttribute('visible', 'false');
        irPara('null'); 
        document.getElementById('ambiente-3d').removeAttribute('environment');
        const videoEl = document.getElementById('video-player');
        videoEl.setAttribute('src', videoSrc); videoEl.load();
        document.getElementById('videosphere').setAttribute('visible', 'true');
        document.getElementById('loader-360').setAttribute('visible', 'true');
        document.getElementById('controle-360-gaze').setAttribute('visible', 'true');
        videoEl.play();
    }

    function setupVideoEvents() {
        const video = document.getElementById('video-player');
        video.addEventListener('playing', () => { 
            document.getElementById('loader-360').setAttribute('visible', 'false'); 
            document.getElementById('btnPlay360').classList.add('clicavel');
            document.getElementById('btnVoltar360').classList.add('clicavel');
        });
    }

    function alternarVideo360() {
        const video = document.getElementById('video-player');
        if (video.paused) { video.play(); document.getElementById('btnText360').setAttribute('value', 'Pause'); }
        else { video.pause(); document.getElementById('btnText360').setAttribute('value', 'Play'); }
    }

    function desativarModo360() {
        document.getElementById('videosphere').setAttribute('visible', 'false');
        pararMidiasConteudo();
        document.getElementById('controle-360-gaze').setAttribute('visible', 'false');
    }

    function atualizarAmbiente(idGrupo) {
        if(document.getElementById('videosphere').getAttribute('visible') === 'true') return;
        const el = document.getElementById('ambiente-3d');
        const sky360 = document.getElementById('fundo-360-estatico');
        const telasDaCidade = ['grupo-categorias', 'grupo-informacoes-galeria', 'grupo-quiz', 'grupo-hino'];
        let usarFoto360 = false;
        if (cidadeAtual && telasDaCidade.includes(idGrupo)) {
            const cidade = db[cidadeAtual];
            let imagemFundo = (idGrupo === 'grupo-categorias') ? cidade.fundo360 : (cidade.conteudos[categoriaAtual] ? cidade.conteudos[categoriaAtual].fundo360 || cidade.fundo360 : cidade.fundo360);
            if (imagemFundo) { usarFoto360 = true; el.removeAttribute('environment'); sky360.setAttribute('src', imagemFundo); sky360.setAttribute('visible', 'true'); }
        }
        if (!usarFoto360) {
            sky360.setAttribute('visible', 'false');
            let p = (idGrupo === 'grupo-inicio') ? 'forest' : 'starry';
            el.setAttribute('environment', { preset: p, grid: 'cross' });
        }
    }
    
    function pararMidiasConteudo() {
        const vp = document.getElementById('video-player');
        if (vp) {
            vp.pause();
            vp.removeAttribute('src'); 
            vp.load(); 
        }
    }
  </script>
</head>
<body>

  <a-scene>
    <a-assets>
       <video id="video-player" loop crossorigin="anonymous" playsinline></video>
       <audio id="audio-hino" loop></audio>
    </a-assets>

    <a-entity id="ambiente-3d" environment="preset: forest"></a-entity>
    <a-sky id="fundo-360-estatico" visible="false"></a-sky>
    <a-videosphere id="videosphere" src="#video-player" radius="4900" visible="false" rotation="0 -90 0"></a-videosphere>

    <a-camera>
       <a-cursor id="cursor" color="yellow" fuse="true" fuse-timeout="1500" raycaster="objects: .clicavel"></a-cursor>
       <a-entity id="loader-360" visible="false" position="0 0 -2">
            <a-troika-text value="CARREGANDO..." color="yellow" align="center" width="5"></a-troika-text>
       </a-entity>
    </a-camera>

    <a-entity id="controle-360-gaze" visible="false" position="0 1 -2">
        <a-plane id="btnPlay360" color="#EF2D5E" width="1" height="0.5" class="interativo" onclick="alternarVideo360()">
           <a-troika-text id="btnText360" value="Play/Pause" align="center" position="0 0 0.02" width="2"></a-troika-text>
        </a-plane>
        <a-plane id="btnVoltar360" position="0 -0.6 0" width="0.8" height="0.3" color="#444" class="interativo" onclick="irPara('grupo-categorias')">
            <a-troika-text value="Sair" align="center" position="0 0 0.02" width="2"></a-troika-text>
        </a-plane>
    </a-entity>

    <a-entity id="grupo-inicio" visible="true">
        <a-troika-text value="Amapá Interativo" align="center" position="0 3 -3" width="10" color="#FFF" outline-width="0.02" outline-color="#000"></a-troika-text>     
            <a-troika-text value="Uma viagem imersiva através da Realidade Virtual." align="center" position="0 2.7 -3" width="6" color="#FFFFFF" outline-width="0.02" outline-color="#000"></a-troika-text>  
      <a-plane position="0 1.6 -3" width="1.5" height="0.6" color="#004d40" class="clicavel interativo" onclick="irPara('grupo-cidades')">
            <a-troika-text value="Iniciar" align="center" position="0 0 0.02" width="6"></a-troika-text>
        </a-plane>
    </a-entity>

    <a-entity id="grupo-cidades" visible="false">
        <a-troika-text value="Escolha o Destino" align="center" position="0 2.7 -4" width="8" color="#FFF" outline-width="0.02" outline-color="#000"></a-troika-text>
        <a-entity id="grade-cidades" position="0 0 0"></a-entity>
        <a-plane position="0 0.3 -3" width="1" height="0.4" color="#444" class="interativo" onclick="irPara('grupo-inicio')">
            <a-troika-text value="Voltar" align="center" position="0 0 0.02"></a-troika-text>
        </a-plane>
    </a-entity>

    <a-entity id="grupo-categorias" visible="false">
        <a-troika-text id="titulo-cidade-cat" value="CIDADE" align="center" position="0 2.7 -3" width="10" color="#FFF" outline-width="0.02" outline-color="#000"></a-troika-text>
        <a-plane position="-1.5 2 -3" width="1.2" height="0.6" color="#0000CD" class="interativo" onclick="verConteudo('Historia')">
            <a-troika-text value="História" align="center" position="0 0 0.02" width="5"></a-troika-text>
        </a-plane>
        <a-plane position="0 2 -3" width="1.2" height="0.6" color="#E64A19" class="interativo" onclick="verConteudo('Quiz')">
            <a-troika-text value="Quiz" align="center" position="0 0 0.02" width="5"></a-troika-text>
        </a-plane>
        <a-plane position="1.5 2 -3" width="1.2" height="0.6" color="#388E3C" class="interativo" onclick="verConteudo('Informacoes')">
            <a-troika-text value="Informações" align="center" position="0 0 0.02" width="5"></a-troika-text>
        </a-plane>
        <a-plane position="0 1.2 -3" width="1.2" height="0.6" color="#8B008B" class="interativo" onclick="verConteudo('Hino')">
            <a-troika-text value="Hino" align="center" position="0 0 0.02" width="5"></a-troika-text>
        </a-plane>
        <a-plane position="0 0.4 -3" width="1" height="0.3" color="#444" class="interativo" onclick="irPara('grupo-cidades')">
            <a-troika-text value="Voltar" align="center" position="0 0 0.02"></a-troika-text>
        </a-plane>
    </a-entity>

    <a-entity id="grupo-hino" visible="false">
        <a-troika-text value="Hino Municipal" align="center" position="0 3.2 -3" width="8" color="#FFF" outline-width="0.02" outline-color="#000"></a-troika-text>
        <a-image id="img-hino-display" position="0 1.8 -3" width="2.5" height="1.8"></a-image>
        <a-plane position="0 0.3 -3" width="1.5" height="0.5" color="#EF2D5E" class="interativo" onclick="alternarHino()">
            <a-troika-text id="btn-text-hino" value="Tocar" align="center" position="0 0 0.02" width="5"></a-troika-text>
        </a-plane>
        <a-plane position="0 -0.4 -3" width="1" height="0.3" color="#444" class="interativo" onclick="irPara('grupo-categorias')">
            <a-troika-text value="Voltar" align="center" position="0 0 0.02"></a-troika-text>
        </a-plane>
    </a-entity>

    <a-entity id="grupo-informacoes-galeria" visible="false">
        <a-troika-text value="Informações Gerais" align="center" position="0 2.8 -3" width="8" color="#FFF" outline-width="0.02" outline-color="#000"></a-troika-text>
        <a-entity id="container-molduras-info"></a-entity>
        <a-plane position="0 0.2 -3" width="1" height="0.3" color="#444" class="interativo" onclick="irPara('grupo-categorias')">
            <a-troika-text value="Voltar" align="center" position="0 0 0.02"></a-troika-text>
        </a-plane>
    </a-entity>

    <a-entity id="grupo-quiz" visible="false">
        <a-troika-text id="quiz-titulo" align="center" position="0 3.2 -3" width="8" color="#FFF" outline-width="0.02" outline-color="#000"></a-troika-text>
        <a-troika-text id="quiz-pergunta" align="center" position="0 2.4 -3" width="6" color="#FFD700"></a-troika-text>
        <a-entity id="quiz-opcoes" position="0 0.5 -3"></a-entity>
        <a-troika-text id="quiz-feedback" align="center" position="0 -0.8 -3" width="6"></a-troika-text>
        <a-plane position="0 -1.5 -3" width="1" height="0.3" color="#444" class="interativo" onclick="irPara('grupo-categorias')">
            <a-troika-text value="Voltar" align="center" position="0 0 0.02"></a-troika-text>
        </a-plane>
    </a-entity>

  </a-scene>
</body>
</html>
