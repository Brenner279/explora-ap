<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Explora AP - Mapa Interativo VR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  
  <style>
    /* Tela de entrada 2D */
    body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #004d40; }
    .tela-entrada {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #004d40, #00251a); z-index: 999;
    }
    h1 { color: white; font-size: 2rem; margin-bottom: 10px; text-align: center; }
    p { color: #ccc; margin-bottom: 20px; font-style: italic; }
    button {
      padding: 20px 40px; font-size: 1.2rem; border-radius: 50px; border: none;
      background: #FFD700; color: #333; font-weight: bold; cursor: pointer;
    }
    .escondido { display: none; }
  </style>

  <script>
    let cidadeAtual = '';
    let audioNarracao = null;

    // SEU BANCO DE DADOS
    const db = {
      'vitoria': {
        nome: 'Vitoria do Jari',
        conteudos: {
          'historia': { t: 'VIDEO DA CIDADE', txt: 'Assista ao video.', video: './assets/videos/vitoria.mp4', tipo: 'video', imagemPainel: '', narra: '' },
          'culinaria': { t: 'HINO OFICIAL', txt: 'Ouca o audio.', video: '', tipo: 'audio', imagemPainel: '', narra: './assets/audios/vitoria.mp3' },
          'mapa': { t: 'BANDEIRA', txt: 'Bandeira oficial.', video: '', tipo: 'imagem', imagemPainel: './assets/imagens/vitoria.png', narra: '' }
        }
      },
      // Crie as entradas para as outras cidades aqui...
      'macapa': { nome: 'Macapa', conteudos: {} },
      'oiapoque': { nome: 'Oiapoque', conteudos: {} },
      'mazagao': { nome: 'Mazagao', conteudos: {} },
      'santana': { nome: 'Santana', conteudos: {} },
      // ... adicione todas as 16
    };

    function entrarVR() {
      document.querySelector('.tela-entrada').classList.add('escondido');
      document.getElementById('menu-mapa').setAttribute('visible', 'true');
      
      // Hack para áudio funcionar no celular
      const audioDummy = new Audio(); audioDummy.play().catch(() => {});
    }

    function selecionarCidade(chave) {
      cidadeAtual = chave;
      // Troca Mapa -> Categorias
      document.getElementById('menu-mapa').setAttribute('visible', 'false');
      document.getElementById('menu-categorias').setAttribute('visible', 'true');
      
      let nome = db[chave] ? db[chave].nome : chave;
      document.getElementById('titulo-cat').setAttribute('value', nome.toUpperCase());
    }

    function verConteudo(tipo) {
      if (!db[cidadeAtual]) return;
      const dados = (db[cidadeAtual].conteudos && db[cidadeAtual].conteudos[tipo]) 
                    ? db[cidadeAtual].conteudos[tipo] 
                    : { t: 'EM BREVE', txt: 'Conteudo indisponivel.', tipo: 'texto' };

      // Troca Categorias -> Painel Final
      document.getElementById('menu-categorias').setAttribute('visible', 'false');
      document.getElementById('painel-conteudo').setAttribute('visible', 'true');

      // Preenche dados
      document.getElementById('vr-titulo').setAttribute('value', dados.t);
      document.getElementById('vr-texto').setAttribute('value', dados.txt);
      
      resetarMidia();

      const videoEl = document.getElementById('video-player');
      const telaVideo = document.getElementById('vr-video');
      const imgPainel = document.getElementById('vr-imagem');
      const controles = document.getElementById('controles-media');

      if (dados.tipo === 'video' && dados.video) {
        videoEl.setAttribute('src', dados.video);
        telaVideo.setAttribute('visible', 'true');
        controles.setAttribute('visible', 'true');
        document.getElementById('vr-texto').setAttribute('visible', 'false');
        atualizarBtnPlay('PLAY', 'green');
      } 
      else if (dados.tipo === 'audio' && dados.narra) {
        audioNarracao = new Audio(dados.narra);
        controles.setAttribute('visible', 'true');
        document.getElementById('vr-texto').setAttribute('visible', 'true');
        atualizarBtnPlay('PLAY', 'green');
      }
      else if (dados.tipo === 'imagem' && dados.imagemPainel) {
        imgPainel.setAttribute('src', dados.imagemPainel);
        imgPainel.setAttribute('visible', 'true');
        document.getElementById('vr-texto').setAttribute('visible', 'false');
      }
    }

    function togglePlay() {
      const videoEl = document.getElementById('video-player');
      if (videoEl && videoEl.getAttribute('src')) {
        videoEl.paused ? (videoEl.play(), atualizarBtnPlay('PAUSE', '#FF0000')) : (videoEl.pause(), atualizarBtnPlay('PLAY', '#008000'));
      }
      if (audioNarracao) {
        audioNarracao.paused ? (audioNarracao.play(), atualizarBtnPlay('PAUSE', '#FF0000')) : (audioNarracao.pause(), atualizarBtnPlay('PLAY', '#008000'));
      }
    }

    function reiniciar() {
      const videoEl = document.getElementById('video-player');
      if (videoEl && videoEl.getAttribute('src')) { videoEl.currentTime = 0; videoEl.play(); }
      if (audioNarracao) { audioNarracao.currentTime = 0; audioNarracao.play(); }
      atualizarBtnPlay('PAUSE', '#FF0000');
    }

    function atualizarBtnPlay(texto, cor) {
      const btn = document.getElementById('btn-play-bg');
      if(btn) btn.setAttribute('color', cor);
    }

    function resetarMidia() {
      const v = document.getElementById('video-player');
      v.pause(); v.removeAttribute('src');
      if(audioNarracao) { audioNarracao.pause(); audioNarracao = null; }
      document.getElementById('vr-video').setAttribute('visible', 'false');
      document.getElementById('vr-imagem').setAttribute('visible', 'false');
      document.getElementById('controles-media').setAttribute('visible', 'false');
    }

    function voltarMenu(origem) {
      resetarMidia();
      if(origem === 'conteudo') {
        document.getElementById('painel-conteudo').setAttribute('visible', 'false');
        document.getElementById('menu-categorias').setAttribute('visible', 'true');
      } else {
        document.getElementById('menu-categorias').setAttribute('visible', 'false');
        document.getElementById('menu-mapa').setAttribute('visible', 'true');
      }
    }

    // Função visual para mostrar nome da cidade ao olhar
    AFRAME.registerComponent('hover-cidade', {
      init: function () {
        var el = this.el;
        var label = el.querySelector('.label-cidade');
        el.addEventListener('mouseenter', function () {
          label.setAttribute('visible', 'true');
          el.setAttribute('material', 'opacity', '0.5'); // Fica semi-transparente para indicar foco
        });
        el.addEventListener('mouseleave', function () {
          label.setAttribute('visible', 'false');
          el.setAttribute('material', 'opacity', '0'); // Volta a ficar invisível
        });
      }
    });
  </script>
</head>
<body>

  <div class="tela-entrada">
    <h1>Mapa Interativo AP</h1>
    <p>Olhe para o município no mapa para selecionar</p>
    <button onclick="entrarVR()">ABRIR MAPA 3D</button>
  </div>

  <a-scene background="color: #202020">
    <a-assets>
      <video id="video-player" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
      <img id="img-mapa" src="./assets/imagens/mapa_amapa.png">
      
      <a-mixin id="btn-padrao" geometry="primitive: plane; width: 2.2; height: 0.5" 
               material="color: #333; opacity: 0.9" text="align: center; color: white; width: 4"></a-mixin>
    </a-assets>

    <a-entity id="menu-mapa" visible="false" position="0 1.6 -3">
      <a-text value="SELECIONE NO MAPA" align="center" position="0 2.2 0" width="6"></a-text>

      <a-image src="#img-mapa" width="4" height="4" position="0 0 0"></a-image>

      <a-entity position="0 1.5 0.1" geometry="primitive: circle; radius: 0.3" 
                material="color: #FFD700; opacity: 0" class="interativo" 
                onclick="selecionarCidade('oiapoque')" hover-cidade>
           <a-text value="OIAPOQUE" align="center" position="0 0.4 0" visible="false" class="label-cidade" color="#FFF" width="6" shader="msdf" background="color: black"></a-text>
      </a-entity>

      <a-entity position="0.8 -0.5 0.1" geometry="primitive: circle; radius: 0.3" 
                material="color: #FFD700; opacity: 0" class="interativo" 
                onclick="selecionarCidade('macapa')" hover-cidade>
           <a-text value="MACAPA" align="center" position="0 0.4 0" visible="false" class="label-cidade" color="#FFF" width="6"></a-text>
      </a-entity>

      <a-entity position="-0.5 -1.5 0.1" geometry="primitive: circle; radius: 0.3" 
                material="color: #FFD700; opacity: 0" class="interativo" 
                onclick="selecionarCidade('vitoria')" hover-cidade>
           <a-text value="VITORIA DO JARI" align="center" position="0 0.4 0" visible="false" class="label-cidade" color="#FFF" width="6"></a-text>
      </a-entity>

      </a-entity>

    <a-entity id="menu-categorias" visible="false" position="0 1.6 -3">
      <a-text id="titulo-cat" value="CIDADE" align="center" position="0 1.5 0" color="#FFD700" width="7"></a-text>
      
      <a-entity mixin="btn-padrao" position="0 0.8 0" text="value: VIDEO" class="interativo" onclick="verConteudo('historia')"></a-entity>
      <a-entity mixin="btn-padrao" position="0 0.2 0" text="value: HINO" class="interativo" onclick="verConteudo('culinaria')"></a-entity>
      <a-entity mixin="btn-padrao" position="0 -0.4 0" text="value: BANDEIRA" class="interativo" onclick="verConteudo('mapa')"></a-entity>

      <a-entity geometry="primitive: plane; width: 1.5; height: 0.4" material="color: #777" 
                text="value: << VOLTAR AO MAPA; align: center; width: 3.5" position="0 -1.2 0"
                class="interativo" onclick="voltarMenu('cidades')"></a-entity>
    </a-entity>

    <a-entity id="painel-conteudo" visible="false" position="0 1.6 -3">
      <a-plane color="#000" width="4" height="3" opacity="0.95"></a-plane>

      <a-text id="vr-titulo" value="TITULO" align="center" position="0 1.2 0.1" color="#FFD700" width="6"></a-text>
      <a-text id="vr-texto" value="Texto..." align="center" position="0 0 0.1" width="3.5" wrap-count="35"></a-text>

      <a-video id="vr-video" src="#video-player" width="3.2" height="1.8" position="0 0.1 0.05" visible="false"></a-video>
      <a-image id="vr-imagem" width="2.5" height="1.6" position="0 0.1 0.05" visible="false"></a-image>

      <a-entity id="controles-media" position="0 -1.1 0.2" visible="false">
        <a-entity position="-0.7 0 0" class="interativo" onclick="togglePlay()">
           <a-circle id="btn-play-bg" radius="0.35" color="#008000"></a-circle>
           <a-text value="PLAY/PAUSE" align="center" position="0 0 0.05" width="2.5"></a-text>
        </a-entity>
        <a-entity position="0.7 0 0" class="interativo" onclick="reiniciar()">
           <a-circle radius="0.35" color="#0055ff"></a-circle>
           <a-text value="REINICIAR" align="center" position="0 0 0.05" width="2.5"></a-text>
        </a-entity>
      </a-entity>

      <a-entity geometry="primitive: plane; width: 1.5; height: 0.4" material="color: #555" 
                text="value: << VOLTAR; align: center; width: 4" position="0 -1.8 0"
                class="interativo" onclick="voltarMenu('conteudo')"></a-entity>
    </a-entity>

    <a-camera>
      <a-cursor fuse="true" fuse-timeout="1500" color="yellow" scale="1.5 1.5 1.5" raycaster="objects: .interativo"
        animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1.5 1.5 1.5; dur: 150"
        animation__fusing="property: scale; startEvents: fusing; from: 1.5 1.5 1.5; to: 0.1 0.1 0.1; dur: 1500"
        animation__mouseleave="property: scale; startEvents: mouseleave; to: 1.5 1.5 1.5; dur: 500">
      </a-cursor>
    </a-camera>
  </a-scene>
</body>
</html>
