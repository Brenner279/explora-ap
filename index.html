<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Explora AP - VR Final</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script>
/* ================= DADOS ================= */

const db = {
  vitoria: {
    nome: 'Vitória do Jari',
    conteudos: {
      historia: {
        t: 'VIDEO DA CIDADE',
        txt: 'Olhe para o PLAY',
        video: './assets/videos/vitoria.mp4',
        tipo: 'video'
      },
      culinaria: {
        t: 'HINO MUNICIPAL',
        txt: 'Olhe para o PLAY',
        narra: './assets/audios/vitoria.mp3',
        tipo: 'audio'
      },
      mapa: {
        t: 'BANDEIRA',
        imagemPainel: './assets/imagens/vitoria.png',
        tipo: 'imagem'
      }
    }
  }
};

let cidadeAtual = '';
let audioNarracao = null;

/* ================= INICIALIZAÇÃO ================= */

window.onload = gerarMenuCidades;

/* ================= MENU CIDADES ================= */

function gerarMenuCidades() {
  const container = document.getElementById('grade-cidades');
  Object.keys(db).forEach((chave, i) => {
    const x = (i % 3) * 1.1 - 1.1;
    const y = 1.5 - Math.floor(i / 3) * 0.6;

    const el = document.createElement('a-plane');
    el.setAttribute('position', `${x} ${y} 0`);
    el.setAttribute('width', '1');
    el.setAttribute('height', '0.4');
    el.setAttribute('color', '#FFD700');
    el.setAttribute('class', 'clickable interativo');
    el.setAttribute('onclick', `selecionarCidade('${chave}')`);

    el.innerHTML = `<a-text value="${db[chave].nome}" align="center" color="#333" width="2.8"></a-text>`;
    container.appendChild(el);
  });
}

/* ================= NAVEGAÇÃO ================= */

function irPara(grupo) {
  document.querySelectorAll('[id^="grupo"]').forEach(g => {
    g.setAttribute('visible', 'false');
    g.querySelectorAll('.interativo').forEach(b => b.classList.remove('clickable'));
  });

  const ativo = document.getElementById(grupo);
  ativo.setAttribute('visible', 'true');
  ativo.querySelectorAll('.interativo').forEach(b => b.classList.add('clickable'));

  if (grupo !== 'grupo-player') pararTudo();
}

function selecionarCidade(chave) {
  cidadeAtual = chave;
  document.getElementById('titulo-cidade-cat').setAttribute('value', db[chave].nome);
  irPara('grupo-categorias');
}

/* ================= CONTEÚDO ================= */

function verConteudo(tipo) {
  const dados = db[cidadeAtual].conteudos[tipo];
  if (!dados) return;

  pararTudo();

  const video = document.getElementById('video-player');
  const telaVideo = document.getElementById('vr-video-screen');
  const img = document.getElementById('vr-imagem-screen');
  const controles = document.getElementById('controles-media');

  telaVideo.setAttribute('visible', 'false');
  img.setAttribute('visible', 'false');
  controles.setAttribute('visible', 'false');

  document.getElementById('vr-titulo').setAttribute('value', dados.t);
  document.getElementById('vr-texto').setAttribute('value', dados.txt || '');

  if (dados.tipo === 'video') {
    video.src = dados.video;
    telaVideo.setAttribute('visible', 'true');
    controles.setAttribute('visible', 'true');
  }

  if (dados.tipo === 'audio') {
    audioNarracao = new Audio(dados.narra);
    controles.setAttribute('visible', 'true');
  }

  if (dados.tipo === 'imagem') {
    img.setAttribute('src', dados.imagemPainel);
    img.setAttribute('visible', 'true');
  }

  document.getElementById('btn-play-cor').setAttribute('color', 'green');
  document.getElementById('btn-play-txt').setAttribute('value', 'PLAY');

  irPara('grupo-player');
}

/* ================= CONTROLES ================= */

function togglePlay() {
  const video = document.getElementById('video-player');

  if (video.src) {
    if (video.paused) {
      video.muted = true;
      video.play().then(() => video.muted = false);
      setBtnPause();
    } else {
      video.pause();
      setBtnPlay();
    }
  }

  if (audioNarracao) {
    audioNarracao.paused ? audioNarracao.play() : audioNarracao.pause();
  }
}

function restartMedia() {
  const video = document.getElementById('video-player');
  if (video.src) {
    video.currentTime = 0;
    video.play();
    setBtnPause();
  }
  if (audioNarracao) {
    audioNarracao.currentTime = 0;
    audioNarracao.play();
  }
}

function pararTudo() {
  const video = document.getElementById('video-player');
  video.pause();
  video.currentTime = 0;
  if (audioNarracao) {
    audioNarracao.pause();
    audioNarracao = null;
  }
}

function setBtnPlay() {
  document.getElementById('btn-play-cor').setAttribute('color', 'green');
  document.getElementById('btn-play-txt').setAttribute('value', 'PLAY');
}

function setBtnPause() {
  document.getElementById('btn-play-cor').setAttribute('color', 'red');
  document.getElementById('btn-play-txt').setAttribute('value', 'PAUSE');
}
</script>
</head>

<body>
<a-scene background="color:#111">

<a-assets>
  <video id="video-player"
         preload="auto"
         crossorigin="anonymous"
         playsinline
         webkit-playsinline></video>
</a-assets>

<a-camera position="0 1.6 0">
  <a-cursor fuse="true" fuse-timeout="1500"
    raycaster="objects: .clickable"></a-cursor>
</a-camera>

<!-- GRUPOS -->
<a-entity id="grupo-inicio" visible="true">
  <a-plane position="0 1 -3" width="1.5" height="0.6"
    class="clickable interativo" onclick="irPara('grupo-cidades')">
    <a-text value="INICIAR" align="center"></a-text>
  </a-plane>
</a-entity>

<a-entity id="grupo-cidades" visible="false">
  <a-entity id="grade-cidades" position="0 0.5 -3"></a-entity>
</a-entity>

<a-entity id="grupo-categorias" visible="false">
  <a-text id="titulo-cidade-cat" position="0 2.5 -3"></a-text>
  <a-plane position="0 1 -3" class="clickable interativo"
    onclick="verConteudo('historia')">
    <a-text value="VIDEO"></a-text>
  </a-plane>
</a-entity>

<a-entity id="grupo-player" visible="false">
  <a-video id="vr-video-screen" src="#video-player"
    width="3" height="1.6" position="0 1.6 -3" visible="false"></a-video>

  <a-image id="vr-imagem-screen" visible="false"
    width="2" height="1.4" position="0 1.6 -3"></a-image>

  <a-entity id="controles-media" position="0 0 -3" visible="false">
    <a-entity class="clickable interativo" onclick="togglePlay()">
      <a-circle id="btn-play-cor" radius="0.25" color="green"></a-circle>
      <a-text id="btn-play-txt" value="PLAY" position="0 -0.4 0"></a-text>
    </a-entity>
  </a-entity>
</a-entity>

</a-scene>
</body>
</html>
