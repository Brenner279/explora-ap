<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Explora AP - AR.js Teste</title>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    
    /* Interface Flutuante para instruções */
    #info {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      z-index: 100;
      display: block;
      pointer-events: none; /* Permite clicar na cena através do texto */
    }
    
    .msg-box {
      background: rgba(0, 0, 0, 0.7);
      color: #FFD700;
      padding: 10px 20px;
      border-radius: 20px;
      display: inline-block;
      font-weight: bold;
      border: 1px solid white;
    }

    /* Correção de Z-Index para garantir que a câmera fique no fundo */
    .a-canvas { z-index: 1 !important; }
    video { z-index: -1 !important; }
  </style>
</head>

<body style="margin: 0px; overflow: hidden;">

  <div id="info">
    <div class="msg-box">Aponte para o Marcador HIRO</div>
  </div>

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false">

    <a-marker preset="hiro">
        
        <a-box position="0 0.5 0" material="color: red; opacity: 0.8;"
               animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-box>

        <a-text value="FUNCIONOU!" color="white" align="center" position="0 1.5 0" scale="2 2 2" rotation="-90 0 0"></a-text>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
