<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Explora AP - Full VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script>
    /* ================= BANCO DE DADOS ================= */

    const db = {
      vitoria: {
        nome: 'Vitória do Jari',
        conteudos: {
          historia: {
            t: 'VÍDEO',
            txt: 'Assista ao vídeo.',
            tipo: 'video',
            video: './assets/videos/vitoria.mp4'
          },
          culinaria: {
            t: 'HINO',
            txt: 'Ouça o hino.',
            tipo: 'audio',
            audio: './assets/audios/vitoria.mp3'
          },
          mapa: {
            t: 'BANDEIRA',
            txt: 'Veja a bandeira.',
            tipo: 'imagem',
            imagem: './assets/imagens/vitoria.png'
          }
        }
      }
    };

    let cidadeAtual = null;
    let audio = null;
    let video = null;

    window.onload = () => gerarMenuCidades();

    /* ================= MENU DE CIDADES ================= */

    function gerarMenuCidades() {
      const container = document.getElementById('grade-cidades');
      let x = -1.2;

      Object.keys(db).forEach(chave => {
        const el = document.createElement('a-plane');
        el.setAttribute('position', `${x} 0 -3`);
        el.setAttribute('width', '1');
        el.setAttribute('height', '0.4');
        el.setAttribute('color', '#FFF');
        el.setAttribute('class', 'clickable interativo');
        el.setAttribute('onclick', `selecionarCidade('${chave}')`);

        el.innerHTML = `<a-text value="${db[chave].nome}" align="center" color="#000"></a-text>`;
        container.appendChild(el);

        x += 1.3;
      });
    }

    /* ================= NAVEGAÇÃO ================= */

    function navegar(id) {
      ['inicio', 'cidades', 'categorias', 'painel'].forEach(t =>
        document.getElementById(`grupo-${t}`).setAttribute('visible', 'false')
      );

      document.getElementById(id).setAttribute('visible', 'true');
      pararMidia();
    }

    function selecionarCidade(chave) {
      cidadeAtual = chave;
      document.getElementById('titulo-cidade')
        .setAttribute('value', db[chave].nome);
      navegar('grupo-categorias');
    }

    /* ================= CONTEÚDO ================= */

    function verConteudo(tipo) {
      const dados = db[cidadeAtual].conteudos[tipo];

      document.getElementById('painel-titulo').setAttribute('value', dados.t);
      document.getElementById('painel-texto').setAttribute('value', dados.txt || '');

      document.getElementById('painel-video').setAttribute('visible', 'false');
      document.getElementById('painel-img').setAttribute('visible', 'false');
      document.getElementById('btn-play').setAttribute('visible', 'false');

      if (dados.tipo === 'video') prepararVideo(dados.video);
      if (dados.tipo === 'audio') prepararAudio(dados.audio);
      if (dados.tipo === 'imagem') prepararImagem(dados.imagem);

      navegar('grupo-painel');
    }

    /* ================= MÍDIA ================= */

    function prepararVideo(src) {
      video = document.getElementById('video-player');
      video.pause();
      video.src = src;
      video.load();
      video.muted = true;

      document.getElementById('painel-video')
        .setAttribute('src', '#video-player');
      document.getElementById('painel-video')
        .setAttribute('visible', 'true');

      document.getElementById('btn-play').setAttribute('visible', 'true');
    }

    function prepararAudio(src) {
      if (audio) audio.pause();
      audio = new Audio(src);
      document.getElementById('btn-play').setAttribute('visible', 'true');
    }

    function prepararImagem(src) {
      document.getElementById('painel-img')
        .setAttribute('src', src);
      document.getElementById('painel-img')
        .setAttribute('visible', 'true');
    }

    function togglePlay() {
      const txt = document.getElementById('txt-play');

      if (video) {
        if (video.paused) {
          video.muted = false;
          video.play();
          txt.setAttribute('value', 'PAUSE');
        } else {
          video.pause();
          txt.setAttribute('value', 'PLAY');
        }
      }

      if (audio) {
        if (audio.paused) {
          audio.play();
          txt.setAttribute('value', 'PAUSE');
        } else {
          audio.pause();
          txt.setAttribute('value', 'PLAY');
        }
      }
    }

    function pararMidia() {
      if (video) video.pause();
      if (audio) audio.pause();
      document.getElementById('txt-play').setAttribute('value', 'PLAY');
    }
  </script>
</head>

<body>
<a-scene background="color: #111">

  <a-assets>
    <video id="video-player" playsinline webkit-playsinline crossorigin="anonymous"></video>
  </a-assets>

  <a-camera position="0 1.6 0">
    <a-cursor
      fuse="true"
      fuse-timeout="1200"
      raycaster="objects: .clickable">
    </a-cursor>
  </a-camera>

  <!-- INÍCIO -->
  <a-entity id="grupo-inicio">
    <a-text value="EXPLORA AP" position="0 2 -3" align="center"></a-text>
    <a-plane position="0 1 -3" width="1.2" height="0.5"
      class="clickable interativo"
      onclick="navegar('grupo-cidades')">
      <a-text value="INICIAR" align="center"></a-text>
    </a-plane>
  </a-entity>

  <!-- CIDADES -->
  <a-entity id="grupo-cidades" visible="false">
    <a-text value="ESCOLHA O DESTINO" position="0 2 -3" align="center"></a-text>
    <a-entity id="grade-cidades"></a-entity>
  </a-entity>

  <!-- CATEGORIAS -->
  <a-entity id="grupo-categorias" visible="false">
    <a-text id="titulo-cidade" position="0 2.2 -3" align="center"></a-text>

    <a-plane position="-1 1 -3" class="clickable" onclick="verConteudo('historia')">
      <a-text value="VÍDEO"></a-text>
    </a-plane>

    <a-plane position="0 1 -3" class="clickable" onclick="verConteudo('culinaria')">
      <a-text value="HINO"></a-text>
    </a-plane>

    <a-plane position="1 1 -3" class="clickable" onclick="verConteudo('mapa')">
      <a-text value="BANDEIRA"></a-text>
    </a-plane>
  </a-entity>

  <!-- PAINEL -->
  <a-entity id="grupo-painel" visible="false">
    <a-text id="painel-titulo" position="0 2.4 -2.5" align="center"></a-text>

    <a-video id="painel-video" width="2.8" height="1.5"
      position="0 1.5 -2.5" visible="false"></a-video>

    <a-image id="painel-img" width="2"
      position="0 1.5 -2.5" visible="false"></a-image>

    <a-entity id="btn-play" position="0 0.4 -2.5" visible="false">
      <a-circle radius="0.2" color="green"
        class="clickable"
        onclick="togglePlay()">
        <a-text id="txt-play" value="PLAY" align="center"></a-text>
      </a-circle>
    </a-entity>

    <a-text id="painel-texto" position="0 0.1 -2.5" align="center"></a-text>
  </a-entity>

</a-scene>
</body>
</html>
