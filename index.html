<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Explora AP - TCC (Versão AR.js)</title>
  
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    /* --- DESIGN --- */
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* A tela da interface fica sobre o canvas 3D */
    .tela { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #004d40, #00695c, #80cbc4); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; transition: opacity 0.5s; pointer-events: auto; }
    
    /* Quando estamos na cena, a tela some */
    .escondido { display: none !important; }
    
    .conteudo-scroll { width: 100%; height: 70%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 2.5rem; color: white; margin-bottom: 5px; text-shadow: 0 3px 6px rgba(0,0,0,0.4); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; text-align: center; }
    .subtitulo { color: #b2dfdb; margin-bottom: 20px; text-align: center; max-width: 90%; font-size: 0.9rem; font-style: italic; }
    h2 { color: #FFD700; margin-bottom: 20px; text-shadow: 1px 1px 2px black; }
    p { color: #eee; margin-bottom: 30px; text-align: center; max-width: 80%; }
    
    .btn { width: 280px; padding: 15px; margin: 8px; border: none; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s; }
    .btn:hover { transform: scale(1.02); }
    .btn-ra { background-color: #fff; color: #004d40; }
    .btn-vr { background-color: #222; color: #FFD700; border: 2px solid #FFD700; }
    
    .grid-cidades { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 50px; }
    .btn-cidade { width: 140px; padding: 12px; margin: 0; background: linear-gradient(90deg, #FFD700 0%, #FFA000 100%); color: #3e2723; font-size: 0.85rem; border-radius: 10px; }
    
    .grid-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn-cat { width: 130px; padding: 15px; border-radius: 15px; font-size: 0.95rem; background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.4); cursor: pointer; }
    
    .btn-voltar-fixo { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); color: white; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 0.9rem; z-index: 1000; cursor: pointer; }
    
    footer { position: absolute; bottom: 5px; width: 100%; text-align: center; color: rgba(255,255,255,0.4); font-size: 0.7rem; }
    
    /* Ajuste para o vídeo do AR.js não cobrir a UI */
    #arjs-video { z-index: 1 !important; }
  </style>

  <script>
    /* --- LÓGICA DO SISTEMA --- */
    
    let cidadeAtual = '';
    let audioFundo = null;
    let audioNarracao = null;
    let estadoPlay = false;

    // --- BANCO DE DADOS COMPLETO ---
    const db = {
      'vitoria': {
        nome: 'Vitória do Jari',
        somAmbiente: './assets/audios/ambiente_rio.mp3', 
        conteudos: {
          'historia': { t: 'VÍDEO DA CIDADE', txt: 'Conheça a orla e a história.', video: './assets/videos/vitoria.mp4', tipo: 'video', cor: '#5D4037', narra: '' },
          'culinaria': { t: 'HINO MUNICIPAL', txt: 'Ouvindo o hino oficial.', video: '', tipo: 'audio', cor: '#E64A19', narra: './assets/audios/vitoria.mp3' },
          'mapa': { t: 'BANDEIRA', txt: 'Símbolo oficial.', imagemPainel: './assets/imagens/vitoria.png', tipo: 'imagem', video: '', cor: '#388E3C', narra: '' }
        }
      },
      'macapa': { 
        nome: 'Macapá', 
        somAmbiente: './assets/audios/ambiente_cidade.mp3', 
        conteudos: { 
          'historia': { t: 'MARCO ZERO', txt: 'Onde os hemisférios se encontram.', video: './assets/videos/macapa.mp4', tipo: 'video', cor: '#0288D1', narra: '' }, 
          'culinaria': { t: 'CANÇÃO DO AMAPÁ', txt: 'Hino da capital.', video: '', tipo: 'audio', cor: '#0288D1', narra: './assets/audios/macapa.mp3' }, 
          'mapa': { t: 'BANDEIRA', txt: 'Visualizando bandeira.', imagemPainel: './assets/imagens/macapa.png', tipo: 'imagem', video: '', cor: '#01579B', narra: '' } 
        } 
      },
      'santana': { 
        nome: 'Santana', 
        somAmbiente: './assets/audios/ambiente_porto.mp3', 
        conteudos: { 
          'historia': { t: 'PORTO DE SANTANA', txt: 'Principal porto do estado.', video: './assets/videos/santana.mp4', tipo: 'video', cor: '#FBC02D', narra: '' }, 
          'culinaria': { t: 'HINO DE SANTANA', txt: 'Hino do município.', video: '', tipo: 'audio', cor: '#F9A825', narra: './assets/audios/santana.mp3' }, 
          'mapa': { t: 'BANDEIRA', txt: 'Símbolo de Santana.', imagemPainel: './assets/imagens/santana.png', tipo: 'imagem', video: '', cor: '#F57F17', narra: '' } 
        } 
      },
      'mazagao': { 
        nome: 'Mazagão', 
        somAmbiente: './assets/audios/ambiente_batuque.mp3', 
        conteudos: { 
          'historia': { t: 'SÃO TIAGO', txt: 'Batalha Mouros e Cristãos.', video: './assets/videos/mazagao.mp4', tipo: 'video', cor: '#C62828', narra: '' }, 
          'culinaria': { t: 'HINO DE MAZAGÃO', txt: 'Tradição e história.', video: '', tipo: 'audio', cor: '#B71C1C', narra: './assets/audios/mazagao.mp3' }, 
          'mapa': { t: 'BANDEIRA', txt: 'Símbolo histórico.', imagemPainel: './assets/imagens/mazagao.png', tipo: 'imagem', video: '', cor: '#880E4F', narra: '' } 
        } 
      },
      'oiapoque': { 
        nome: 'Oiapoque', 
        somAmbiente: './assets/audios/ambiente_fronteira.mp3', 
        conteudos: { 
          'historia': { t: 'FRONTEIRA', txt: 'O começo do Brasil.', video: './assets/videos/oiapoque.mp4', tipo: 'video', cor: '#43A047', narra: '' }, 
          'culinaria': { t: 'HINO DE OIAPOQUE', txt: 'Hino do extremo norte.', video: '', tipo: 'audio', cor: '#2E7D32', narra: './assets/audios/oiapoque.mp3' }, 
          'mapa': { t: 'BANDEIRA', txt: 'Símbolo local.', imagemPainel: './assets/imagens/oiapoque.png', tipo: 'imagem', video: '', cor: '#1B5E20', narra: '' } 
        } 
      },
      // Placeholders para evitar erros
      'amapa': criarPlaceholder('Amapá'),
      'calcoene': criarPlaceholder('Calçoene'),
      'cutias': criarPlaceholder('Cutias'),
      'ferreira': criarPlaceholder('Ferreira Gomes'),
      'itaubal': criarPlaceholder('Itaubal'),
      'laranjal': criarPlaceholder('Laranjal do Jari'),
      'pedra': criarPlaceholder('Pedra Branca'),
      'porto': criarPlaceholder('Porto Grande'),
      'pracuuba': criarPlaceholder('Pracuúba'),
      'serra': criarPlaceholder('Serra do Navio'),
      'tartarugal': criarPlaceholder('Tartarugalzinho')
    };

    function criarPlaceholder(nome) {
        return { nome: nome, somAmbiente: '', conteudos: { 'historia': {t:'EM BREVE', txt:'Em produção', tipo:'texto'}, 'culinaria': {t:'EM BREVE', txt:'Em produção', tipo:'texto'}, 'mapa': {t:'EM BREVE', txt:'Em produção', tipo:'texto'} } };
    }

    // --- GERENCIAMENTO AR / VR ---
    function controlarCameraAR(ligar) {
      // O AR.js cria uma tag <video> automaticamente no body. Precisamos controlá-la.
      const videoAr = document.querySelector('video'); 
      const marcador = document.getElementById('marcador-ar');

      if (ligar) {
        // MODO AR: Mostra vídeo, esconde céu falso, mostra marcador
        if(videoAr) videoAr.style.display = 'block';
        document.getElementById('ceu').setAttribute('visible', 'false');
        if(marcador) marcador.setAttribute('visible', 'true');
      } else {
        // MODO VR: Esconde vídeo da câmera, mostra céu falso, esconde marcador
        if(videoAr) videoAr.style.display = 'none';
        document.getElementById('ceu').setAttribute('visible', 'true');
        if(marcador) marcador.setAttribute('visible', 'false');
      }
    }

    // --- CONTROLE DE MÍDIA (IGUAL ANTERIOR) ---
    function togglePlay() {
      const videoEl = document.getElementById('video-player');
      const btnTexto = document.getElementById('txt-btn-play');
      const btnCor = document.getElementById('btn-play');

      if (videoEl && !videoEl.paused) {
        videoEl.pause();
        btnTexto.setAttribute('value', 'PLAY');
        btnCor.setAttribute('color', 'green');
      } else if (videoEl && videoEl.paused && videoEl.getAttribute('src')) {
        videoEl.play();
        btnTexto.setAttribute('value', 'PAUSE');
        btnCor.setAttribute('color', 'red');
      }
      if (audioNarracao) {
        if (!audioNarracao.paused) {
          audioNarracao.pause();
          btnTexto.setAttribute('value', 'PLAY');
          btnCor.setAttribute('color', 'green');
        } else {
          audioNarracao.play();
          btnTexto.setAttribute('value', 'PAUSE');
          btnCor.setAttribute('color', 'red');
        }
      }
    }

    function reiniciarMedia() {
      const videoEl = document.getElementById('video-player');
      if (videoEl && videoEl.getAttribute('src')) {
        videoEl.currentTime = 0; videoEl.play();
      }
      if (audioNarracao) {
        audioNarracao.currentTime = 0; audioNarracao.play();
      }
      document.getElementById('txt-btn-play').setAttribute('value', 'PAUSE');
      document.getElementById('btn-play').setAttribute('color', 'red');
    }

    function tocarFundo(url) {
      if(audioFundo) { audioFundo.pause(); audioFundo = null; }
      if(url && url.length > 5) {
        audioFundo = new Audio(url);
        audioFundo.volume = 0.2; audioFundo.loop = true;
        audioFundo.play().catch(e => console.log("Interaja para tocar"));
      }
    }

    function prepararAudioPrincipal(url) {
      if(audioNarracao) { audioNarracao.pause(); audioNarracao = null; }
      if(url && url.length > 5) {
        audioNarracao = new Audio(url);
        audioNarracao.volume = 1.0;
      }
    }

    function pararTudo() {
      if(audioFundo) { audioFundo.pause(); audioFundo = null; }
      if(audioNarracao) { audioNarracao.pause(); audioNarracao = null; }
      const v = document.getElementById('video-player');
      if(v) { v.pause(); v.removeAttribute('src'); }
    }

    // --- NAVEGAÇÃO ---
    function irPara(telaId) {
      // Esconde todas as telas HTML
      document.querySelectorAll('.tela').forEach(t => t.classList.add('escondido'));
      
      // Se não for 'cenario' (que é o A-Frame puro), mostra a tela desejada
      if(telaId !== 'cenario') {
        document.getElementById(telaId).classList.remove('escondido');
      }
    }

    function iniciarRA() {
      // 1. Mostra a cena A-Frame
      irPara('cenario'); 
      
      // 2. Esconde o grupo de VR (Painel Flutuante)
      document.getElementById('grupo-vr').setAttribute('visible', 'false');
      
      // 3. Ativa a câmera AR e o marcador
      controlarCameraAR(true);
      
      // 4. Botões de voltar
      document.getElementById('btn-voltar-ra').classList.remove('escondido');
      document.getElementById('btn-voltar-vr').classList.add('escondido');
      
      alert("Aponte para o Marcador HIRO");
    }

    function sairRA() {
      pararTudo();
      controlarCameraAR(false); // Desliga câmera
      irPara('tela-inicio');
      document.getElementById('btn-voltar-ra').classList.add('escondido');
    }

    function iniciarFluxoVR() { 
      irPara('tela-cidades'); 
      controlarCameraAR(false); // Garante câmera desligada
    }

    function selecionarCidade(chave) {
      cidadeAtual = chave;
      document.getElementById('nome-cidade-escolhida').innerText = db[chave].nome;
      tocarFundo(db[chave].somAmbiente);
      irPara('tela-categorias');
    }

    function verConteudoVR(tipo) {
      if (db[cidadeAtual] && db[cidadeAtual].conteudos[tipo]) {
         const dados = db[cidadeAtual].conteudos[tipo];
         
         // Configuração VR
         controlarCameraAR(false); // Garante que a câmera do mundo real suma
         document.getElementById('grupo-vr').setAttribute('visible', 'true');
         
         const ceu = document.getElementById('ceu');
         ceu.setAttribute('visible', 'true');
         ceu.setAttribute('color', dados.cor || '#333');

         document.getElementById('vr-titulo').setAttribute('value', dados.t);
         document.getElementById('vr-texto').setAttribute('value', dados.txt);
         
         const videoEl = document.getElementById('video-player');
         const telaVideo = document.getElementById('vr-video');
         const imagemPainel = document.getElementById('vr-imagem-painel');
         const controles = document.getElementById('controles-media');

         // Reset
         telaVideo.setAttribute('visible', 'false');
         imagemPainel.setAttribute('visible', 'false');
         controles.setAttribute('visible', 'false');
         videoEl.pause(); videoEl.removeAttribute('src');

         if (dados.video && dados.video.length > 5) {
           videoEl.setAttribute('src', dados.video);
           telaVideo.setAttribute('visible', 'true');
           controles.setAttribute('visible', 'true');
           document.getElementById('vr-texto').setAttribute('visible', 'false');
           document.getElementById('txt-btn-play').setAttribute('value', 'PLAY');
           document.getElementById('btn-play').setAttribute('color', 'green');
         } 
         else if (dados.imagemPainel && dados.imagemPainel.length > 5) {
           imagemPainel.setAttribute('src', dados.imagemPainel);
           imagemPainel.setAttribute('visible', 'true');
           document.getElementById('vr-texto').setAttribute('visible', 'false');
         }
         else if (dados.tipo === 'audio' && dados.narra) {
           prepararAudioPrincipal(dados.narra);
           controles.setAttribute('visible', 'true');
           document.getElementById('vr-texto').setAttribute('visible', 'true');
           document.getElementById('txt-btn-play').setAttribute('value', 'PLAY');
           document.getElementById('btn-play').setAttribute('color', 'green');
         }
         else {
           document.getElementById('vr-texto').setAttribute('visible', 'true');
         }

         irPara('cenario');
         document.getElementById('btn-voltar-vr').classList.remove('escondido');
         document.getElementById('btn-voltar-ra').classList.add('escondido');
      }
    }

    function voltarParaCategorias() {
      pararTudo();
      if(audioFundo) audioFundo.volume = 0.3;
      document.getElementById('btn-voltar-vr').classList.add('escondido');
      irPara('tela-categorias');
    }
  </script>
</head>
<body>

  <div id="tela-inicio" class="tela">
    <h1>Explora AP</h1>
    <p class="subtitulo">"Tecnologias Imersivas e o Patrimônio do Amapá"</p>
    <button class="btn btn-ra" onclick="iniciarRA()">📷 Realidade Aumentada</button>
    <button class="btn btn-vr" onclick="iniciarFluxoVR()">👓 Realidade Virtual</button>
    <footer>TCC - Inovação e Tecnologias Educacionais • 2025</footer>
  </div>

  <div id="tela-cidades" class="tela escondido">
    <h2>Destinos</h2>
    <div class="conteudo-scroll">
      <div class="grid-cidades">
        <button class="btn btn-cidade" onclick="selecionarCidade('vitoria')">Vitória do Jari</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('amapa')">Amapá</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('calcoene')">Calçoene</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('cutias')">Cutias</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('ferreira')">Ferreira Gomes</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('itaubal')">Itaubal</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('laranjal')">Laranjal do Jari</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('macapa')">Macapá</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('mazagao')">Mazagão</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('oiapoque')">Oiapoque</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('pedra')">Pedra Branca</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('porto')">Porto Grande</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('pracuuba')">Pracuúba</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('santana')">Santana</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('serra')">Serra do Navio</button>
        <button class="btn btn-cidade" onclick="selecionarCidade('tartarugal')">Tartarugalzinho</button>
      </div>
    </div>
    <button class="btn" style="background:transparent; border:1px solid #aaa; color:#ddd; margin-top:15px" onclick="pararTudo(); irPara('tela-inicio')">⬅ Voltar</button>
  </div>

  <div id="tela-categorias" class="tela escondido">
    <h2 id="nome-cidade-escolhida">Cidade</h2>
    <p>O que deseja explorar?</p>
    <div class="grid-botoes">
      <button class="btn-cat" onclick="verConteudoVR('historia')">🎬 Vídeo</button>
      <button class="btn-cat" onclick="verConteudoVR('culinaria')">🎵 Hino</button>
      <button class="btn-cat" onclick="verConteudoVR('mapa')">🏳️ Bandeira</button>
    </div>
    <button class="btn" style="background:transparent; border:1px solid #aaa; color:#ddd; margin-top:30px" onclick="pararTudo(); irPara('tela-cidades')">⬅ Trocar Cidade</button>
  </div>

  <div id="btn-voltar-vr" class="btn-voltar-fixo escondido" onclick="voltarParaCategorias()">⬅ Voltar ao Menu</div>
  <div id="btn-voltar-ra" class="btn-voltar-fixo escondido" onclick="sairRA()">⬅ Sair da RA</div>

  <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" 
      renderer="logarithmicDepthBuffer: true;"
      vr-mode-ui="enabled: false">
    
    <a-assets>
       <video id="video-player" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-sky id="ceu" color="#333" visible="false"></a-sky>

    <a-entity id="grupo-vr" visible="false">
      <a-entity position="0 1.6 -3">
        <a-plane color="#111" opacity="0.95" width="3.5" height="2" border="color: white; width: 0.05"></a-plane>
        
        <a-text id="vr-titulo" value="TITULO" align="center" position="0 0.8 0.1" color="#FFD700" width="6"></a-text>
        <a-text id="vr-texto" value="Texto..." align="center" position="0 -0.2 0.1" width="3.2" wrap-count="32"></a-text>
        
        <a-video id="vr-video" src="#video-player" width="3" height="1.5" position="0 -0.1 0.05" visible="false"></a-video>
        <a-image id="vr-imagem-painel" width="2" height="1.4" position="0 -0.1 0.06" visible="false"></a-image>

        <a-entity id="controles-media" position="0 -1.3 0" visible="false">
            <a-entity position="-0.5 0 0" onclick="togglePlay()" class="clickable">
                <a-circle id="btn-play" radius="0.25" color="green"></a-circle>
                <a-text id="txt-btn-play" value="PLAY" align="center" position="0 0 0.1" scale="0.8 0.8 0.8"></a-text>
            </a-entity>
            <a-entity position="0.5 0 0" onclick="reiniciarMedia()" class="clickable">
                <a-circle id="btn-restart" radius="0.25" color="#0055ff"></a-circle>
                <a-text value="RESTART" align="center" position="0 0 0.1" scale="0.6 0.6 0.6"></a-text>
            </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-marker preset="hiro" id="marcador-ar" visible="false">
        <a-box position="0 0.5 0" material="color: #FFD700; opacity: 0.9; transparent: true" 
               animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
        </a-box>
        <a-text value="EXPLORA AP" position="0 1.2 0" align="center" color="white" scale="1.5 1.5 1.5" rotation="-90 0 0"></a-text>
    </a-marker>

    <a-entity camera>
        <a-cursor color="yellow" fuse="false" scale="0.5 0.5 0.5"></a-cursor>
    </a-entity>

  </a-scene>

</body>
</html>
